<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nathan Ghys · Fréquences</title>
<meta name="description" content="Portfolio de Nathan Ghys, développeur full-stack : un poste de radio dont chaque station diffuse un projet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,300..900&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="set" id="set">
  <header class="brand">
    <p class="maker"><b id="maker"></b> · récepteur de projets</p>
    <div class="lamps"><span class="lamp" id="lampLock">Calé</span><span class="lamp" id="lampOn">Sous tension</span></div>
  </header>

  <section class="dial" id="dial" aria-label="Cadran de fréquences">
    <div class="glass">
      <div class="scale" id="scale"></div>
      <div class="needle" id="needle"><i></i></div>
    </div>
  </section>

  <section class="readout">
    <div class="freq"><span id="mhz">88.0</span><small>MHz</small></div>
    <div class="meter" id="meter" aria-hidden="true"></div>
    <canvas id="scope" aria-hidden="true"></canvas>
    <div class="controls">
      <button id="prev" aria-label="Station précédente">◂</button>
      <div class="knob" id="knob" role="slider" tabindex="0" aria-label="Bouton d'accord" aria-valuemin="87.5" aria-valuemax="108"><i></i></div>
      <button id="next" aria-label="Station suivante">▸</button>
      <button id="sound" class="sound" aria-pressed="false">Son coupé</button>
    </div>
  </section>

  <section class="air" id="air" aria-live="polite">
    <div class="broadcast" id="broadcast"></div>
    <div class="qsl-wrap"><article class="qsl" id="qsl"></article></div>
    <canvas id="static" aria-hidden="true"></canvas>
  </section>
</main>

<div class="power" id="power">
  <button id="powerBtn"><span class="ring"></span>Allumer le poste</button>
  <p>Tourner le bouton, faire défiler ou utiliser ← → pour changer de station.</p>
</div>

<script src="../../shared/data.js"></script>
<script src="../../shared/utils.js"></script>
<script src="signal.js"></script>
<script src="dial.js"></script>
<script src="app.js"></script>
</body>
</html>
